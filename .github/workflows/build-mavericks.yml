name: Build JBR 25 for macOS 10.9 Mavericks

on:
  push:
    branches: [jbr25]
    tags: ['v*']
  workflow_dispatch:

env:
  DEPLOYMENT_TARGET: "10.9"

jobs:
  build:
    name: Build JBR 25 (x86_64, 10.9)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install llvm@17 autoconf

      - name: Download macOS 10.9 SDK
        run: |
          curl -sL -o /tmp/MacOSX10.9.sdk.tar.xz \
            "https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.9.sdk.tar.xz"
          tar xf /tmp/MacOSX10.9.sdk.tar.xz -C ${{ runner.temp }}

      - name: Build macports-legacy-support
        run: |
          git clone --depth 1 https://github.com/macports/macports-legacy-support.git /tmp/legacy-src
          cd /tmp/legacy-src
          make PREFIX=${{ runner.temp }}/legacy \
            CFLAGS="-arch x86_64 -mmacosx-version-min=${{ env.DEPLOYMENT_TARGET }}" \
            LDFLAGS="-arch x86_64 -mmacosx-version-min=${{ env.DEPLOYMENT_TARGET }}" \
            install
          rm -f ${{ runner.temp }}/legacy/lib/libMacportsLegacySupport.dylib

      - name: Install Boot JDK
        run: |
          curl -sL -o /tmp/bootjdk.tar.gz \
            "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.2-osx-aarch64-b373.8.tar.gz"
          mkdir -p ${{ runner.temp }}/bootjdk
          tar xzf /tmp/bootjdk.tar.gz -C ${{ runner.temp }}/bootjdk --strip-components=2

      - name: Configure JBR
        run: |
          LLVM_PATH="$(brew --prefix llvm@17)/bin"
          SDK_PATH="${{ runner.temp }}/MacOSX10.9.sdk"
          LEGACY_PREFIX="${{ runner.temp }}/legacy"
          COMPAT_DIR="${{ github.workspace }}/mavericks-compat"

          bash configure \
            --build=arm64-apple-darwin \
            --host=x86_64-apple-darwin13.0.0 \
            --with-sysroot=$SDK_PATH \
            --with-boot-jdk=${{ runner.temp }}/bootjdk/Home \
            --with-build-jdk=${{ runner.temp }}/bootjdk/Home \
            --with-toolchain-type=clang \
            --disable-warnings-as-errors \
            --with-jvm-variants=server \
            CC="$LLVM_PATH/clang" \
            CXX="$LLVM_PATH/clang++" \
            CPP="$LLVM_PATH/clang -E -arch x86_64 -isysroot $SDK_PATH" \
            CXXCPP="$LLVM_PATH/clang++ -E -arch x86_64 -isysroot $SDK_PATH" \
            --with-extra-cflags="-arch x86_64 -target x86_64-apple-macos10.9 -isysroot $SDK_PATH -I$LEGACY_PREFIX/include -I$COMPAT_DIR -include $COMPAT_DIR/jbr_compat.h -DGL_SILENCE_DEPRECATION" \
            --with-extra-cxxflags="-arch x86_64 -target x86_64-apple-macos10.9 -isysroot $SDK_PATH -I$LEGACY_PREFIX/include -I$COMPAT_DIR -include $COMPAT_DIR/jbr_compat.h -DGL_SILENCE_DEPRECATION" \
            --with-extra-ldflags="-L$LEGACY_PREFIX/lib -lMacportsLegacySupport -Wl,-undefined,dynamic_lookup -isysroot $SDK_PATH" \
            --with-extra-asflags="-arch x86_64 -isysroot $SDK_PATH"

      - name: Build JBR
        run: make images MIG="mig -arch x86_64" JOBS=$(sysctl -n hw.ncpu)

      - name: Package JDK
        run: |
          cd build/macosx-x86_64-server-release/images/jdk-bundle
          COPYFILE_DISABLE=1 tar czf ${{ runner.temp }}/jbr25-mavericks-x86_64.tar.gz jdk-*.jdk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jbr25-mavericks-x86_64
          path: ${{ runner.temp }}/jbr25-mavericks-x86_64.tar.gz

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: JBR 25 for macOS 10.9 Mavericks
          body: |
            ## JetBrains Runtime 25 — macOS 10.9 Mavericks

            OpenJDK 25 cross-compiled for macOS 10.9 (Mavericks) x86_64.
            Built from JetBrains Runtime source with macOS 10.9 compatibility patches.

            ### Usage
            ```bash
            tar xzf jbr25-mavericks-x86_64.tar.gz
            export JAVA_HOME=$PWD/jdk-25.0.2.jdk/Contents/Home
            $JAVA_HOME/bin/java -version
            ```
          files: |
            jbr25-mavericks-x86_64/jbr25-mavericks-x86_64.tar.gz
